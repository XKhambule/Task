```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiry Form</title>
    <link rel="stylesheet" href="css/cs.css">
</head>
<body>

<div class="card">
    <h1>Send an Enquiry</h1>

    <form id="enquiryForm">

        <label for="name">Name</label>
        <input type="text" id="name" placeholder="Enter your name">

        <label for="email">Email</label>
        <input type="email" id="email" placeholder="Enter your email">

        <label for="enquiryType">Enquiry Type</label>
        <select id="enquiryType">
            <option value="">Select an option</option>
            <option value="product">Product Availability</option>
            <option value="service">Service Cost</option>
            <option value="volunteer">Become a Volunteer</option>
            <option value="sponsor">Become a Sponsor</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" rows="5" placeholder="Enter your enquiry"></textarea>

        <button type="submit">Send</button>

        <!-- Loading Spinner -->
        <div id="loader" class="loader hidden"></div>

        <!-- Response Message -->
        <p id="message-box"></p>

    </form>
</div>

<script src="JS/enquiry.js"></script>

</body>
</html>
```
